# Kollabo — Nginx vhost.
# Routes kollabo.pk / www.kollabo.pk → Next.js on :3001.
# Will be upgraded to HTTPS by certbot --nginx -d kollabo.pk -d www.kollabo.pk.

server {
    server_name kollabo.pk www.kollabo.pk;

    # Keep host-only session and OAuth cookies on one public hostname.
    if ($host = www.kollabo.pk) {
        return 308 https://kollabo.pk$request_uri;
    }

    # Inherit these in every proxy location, including /api/.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 20M;

    # ACME challenge (Let's Encrypt). Certbot will replace this with the HTTPS block.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Static cache for hashed assets (Next.js writes them under /_next/static).
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API — give it more time (audit / social sync can be slow).
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Everything else.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Gzip text assets.
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Logs.
    access_log /var/log/nginx/kollabo.access.log;
    error_log  /var/log/nginx/kollabo.error.log;

    listen 80;
    listen [::]:80;
}
